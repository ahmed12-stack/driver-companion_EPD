# Driver Companion: the MAX98357A I2S amplifier is the default sound card.
# plug converts any sound to what the amplifier takes; dmix lets two sounds share it.
pcm.!default {
    type plug
    slave.pcm "dmixer"
}
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:MAX98357A"
        period_size 1024
        buffer_size 8192
        rate 44100
        channels 2
    }
}
ctl.!default {
    type hw
    card MAX98357A
}
